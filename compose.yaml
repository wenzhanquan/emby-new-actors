services:
  emby-new-actors:
    image: wenzhanquan/emby-new-actors:latest
    container_name: emby-new-actors
    restart: unless-stopped
    init: true
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.20
    mem_limit: 192m
    pids_limit: 32
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config.docker.json:/config/config.json:ro
      - ./data:/data
      - ${EMBY_DATA_DIR:?Set EMBY_DATA_DIR in .env}:/emby-auth:ro
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "/app/scheduler.py", "--healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      description: "新增演员增量补全：工作日09:40，跳过历史人物，Strm Assistant升级不覆盖"

  init:
    image: wenzhanquan/emby-new-actors:latest
    profiles: [setup]
    restart: "no"
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["python", "/app/initialize.py"]
    command:
      - --api-app-name
      - ${EMBY_API_APP_NAME:-emby-toolkit}
      - --base-url
      - ${EMBY_BASE_URL:-http://127.0.0.1:8096/emby}
    volumes:
      - ./:/bootstrap
      - ${EMBY_DATA_DIR:?Set EMBY_DATA_DIR in .env}:/emby-auth:ro
